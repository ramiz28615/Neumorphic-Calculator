name: Deploy Wan Studio to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "wan-studio/**"
      - ".github/workflows/pages-wan-studio.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Wan Studio
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./wan-studio

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
